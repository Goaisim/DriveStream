name: DriveStream
options:
  bundleIdPrefix: com.drake
  deploymentTarget:
    iOS: "17.0"

targets:
  DriveStream:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    dependencies:
      - framework: Frameworks/MobileVLCKit.xcframework
        embed: true
        codeSign: false
      - sdk: libc++.tbd
      - sdk: libz.tbd
      - sdk: libbz2.tbd
      - sdk: libxml2.tbd
      - sdk: libiconv.tbd
      - sdk: VideoToolbox.framework
      - sdk: OpenGLES.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreText.framework
      - sdk: QuartzCore.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.drake.drivestream
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/Frameworks"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: DriveStream
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - com.googleusercontent.apps.134960325804-ohug3donf2m9l58oj794tah7f0il4arb

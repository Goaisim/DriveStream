name: Build Fire TV APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Android TV Icons
        run: python3 scripts/generate_android_icons.py

      - name: Build Debug APK
        working-directory: android
        run: gradle assembleDebug

      - name: Package APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk DriveStream-firetv.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DriveStream-firetv
          path: DriveStream-firetv.apk

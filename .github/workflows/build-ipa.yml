name: Build Unsigned IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download MobileVLCKit
        run: |
          mkdir -p Frameworks
          curl -fL "https://download.videolan.org/pub/cocoapods/prod/MobileVLCKit-3.6.0-c73b779f-dd8bfdba.tar.xz" -o MobileVLCKit.tar.xz
          tar -xf MobileVLCKit.tar.xz
          mv MobileVLCKit-binary/MobileVLCKit.xcframework Frameworks/MobileVLCKit.xcframework
          rm -rf MobileVLCKit.tar.xz MobileVLCKit-binary
          ls -la Frameworks/MobileVLCKit.xcframework

      - name: Generate Xcode project
        run: |
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate

      - name: Build unsigned Release app
        run: |
          xcodebuild -project DriveStream.xcodeproj -scheme DriveStream -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGN_IDENTITY="" CODE_SIGN_REQUIRED=NO CODE_SIGNING_ALLOWED=NO clean build

      - name: Package IPA
        run: |
          mkdir -p Payload && cp -r build/Build/Products/Release-iphoneos/DriveStream.app Payload/ && zip -r9 DriveStream-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DriveStream-unsigned
          path: DriveStream-unsigned.ipa
